name: Docker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-container:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supreme_docker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supreme_docker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/supreme_docker_ci?schema=public
      NEXTAUTH_SECRET: supreme-docker-ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      SMOKE_EMAIL: ci-smoke@example.com
      SMOKE_PASSWORD: supreme-ci-smoke-password
      ISOLATION_A_EMAIL: ci-isolation-a@example.com
      ISOLATION_A_PASSWORD: supreme-ci-isolation-a-password
      ISOLATION_B_EMAIL: ci-isolation-b@example.com
      ISOLATION_B_PASSWORD: supreme-ci-isolation-b-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install host dependencies
        run: npm ci

      - name: Install external backup client
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Build migration image
        run: docker build --target migrator --tag supreme-migrator:ci .

      - name: Build application image
        run: docker build --target runner --tag supreme-app:ci .

      - name: Apply migrations from migration image
        run: >-
          docker run --rm --network host
          --env DATABASE_URL
          supreme-migrator:ci

      - name: Start production application container
        run: >-
          docker run --detach --name supreme-app-ci --network host
          --env DATABASE_URL
          --env NEXTAUTH_SECRET
          --env NEXTAUTH_URL
          supreme-app:ci

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs supreme-app-ci
          exit 1

      - name: Register disposable test users
        run: |
          register_user() {
            local name="$1"
            local email="$2"
            local password="$3"
            local response_file
            local status

            response_file=$(mktemp)
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"${name}\",\"email\":\"${email}\",\"password\":\"${password}\"}" \
              http://127.0.0.1:3000/api/auth/register)

            if [ "$status" != "201" ]; then
              echo "Disposable user registration failed with HTTP $status"
              cat "$response_file"
              rm -f "$response_file"
              exit 1
            fi

            rm -f "$response_file"
          }

          register_user "CI Smoke" "$SMOKE_EMAIL" "$SMOKE_PASSWORD"
          register_user "CI Isolation A" "$ISOLATION_A_EMAIL" "$ISOLATION_A_PASSWORD"
          register_user "CI Isolation B" "$ISOLATION_B_EMAIL" "$ISOLATION_B_PASSWORD"

      - name: Verify external backup and disposable restore
        shell: bash
        run: |
          rclone_config="$RUNNER_TEMP/rclone.conf"
          external_directory="$RUNNER_TEMP/external-postgres-backups"
          printf '[ci-external]\ntype = local\n' > "$rclone_config"
          chmod 600 "$rclone_config"

          backup_object="$(
            RCLONE_CONFIG="$rclone_config" \
            RCLONE_DESTINATION="ci-external:${external_directory}" \
            POSTGRES_DOCKER_NETWORK=host \
            bash scripts/postgres-backup.sh
          )"

          RCLONE_CONFIG="$rclone_config" \
          RCLONE_DESTINATION="ci-external:${external_directory}" \
          BACKUP_OBJECT="$backup_object" \
          bash scripts/postgres-restore-test.sh

      - name: Run authenticated smoke test
        run: npm run smoke
        env:
          BASE_URL: http://127.0.0.1:3000
          SMOKE_DATE: "2026-08-09"

      - name: Run multiuser isolation smoke test
        run: npm run smoke:isolation
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Show container logs on failure
        if: failure()
        run: docker logs supreme-app-ci || true

      - name: Stop application container
        if: always()
        run: docker rm --force supreme-app-ci || true
