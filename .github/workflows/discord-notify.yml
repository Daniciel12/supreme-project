name: Discord Notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Send Discord update
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED: ${{ github.event.pull_request.merged }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          extract_section() {
            local heading="$1"
            printf '%s\n' "${PR_BODY:-}" |
              awk -v heading="$heading" '
                $0 ~ "^##[[:space:]]+" heading "[[:space:]]*$" { found=1; next }
                found && $0 ~ "^##[[:space:]]+" { exit }
                found { print }
              ' |
              sed '/^[[:space:]]*<!--.*-->[[:space:]]*$/d; /^[[:space:]]*$/d'
          }

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SUMMARY="$(extract_section "Resumo para o time")"
            IMPACT="$(extract_section "Impacto")"

            if [ -z "$SUMMARY" ]; then
              SUMMARY="$PR_TITLE"
            fi

            if [ -z "$IMPACT" ]; then
              IMPACT="Impacto ainda não informado no resumo do PR."
            fi

            SUMMARY="${SUMMARY:0:500}"
            IMPACT="${IMPACT:0:350}"

            if [ "$EVENT_ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
              EMBED_TITLE="✅ Atualização concluída"
              COLOR=5763719
              NEXT_STEP="A mudança já foi incorporada ao projeto."
            elif [ "$EVENT_ACTION" = "closed" ]; then
              EMBED_TITLE="⏸️ Atualização encerrada"
              COLOR=9807270
              NEXT_STEP="Esta atualização foi encerrada sem entrar no projeto."
            elif [ "$EVENT_ACTION" = "ready_for_review" ]; then
              EMBED_TITLE="👀 Atualização pronta para revisão"
              COLOR=16776960
              NEXT_STEP="A equipe está revisando a mudança antes da conclusão."
            elif [ "$EVENT_ACTION" = "reopened" ]; then
              EMBED_TITLE="🔄 Atualização retomada"
              COLOR=3447003
              NEXT_STEP="O trabalho foi retomado e passará pelas verificações necessárias."
            else
              EMBED_TITLE="🛠️ Nova atualização em desenvolvimento"
              COLOR=3447003
              NEXT_STEP="A equipe iniciou o trabalho e fará as verificações antes de concluir."
            fi

            FOOTER="Supreme • Atualização #${PR_NUMBER}"

            PAYLOAD=$(jq -n \
              --arg title "$EMBED_TITLE" \
              --arg url "$PR_URL" \
              --arg summary "$SUMMARY" \
              --arg impact "$IMPACT" \
              --arg next "$NEXT_STEP" \
              --arg footer "$FOOTER" \
              --argjson color "$COLOR" \
              '{
                allowed_mentions: {parse: []},
                embeds: [{
                  title: $title,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "O que mudou", value: $summary, inline: false},
                    {name: "Impacto", value: $impact, inline: false},
                    {name: "Próximo passo", value: $next, inline: false}
                  ],
                  footer: {text: $footer}
                }]
              }')
          else
            if [ "$CONCLUSION" = "success" ]; then
              EMBED_TITLE="✅ Verificações aprovadas"
              COLOR=5763719
              SUMMARY="As verificações automáticas de qualidade e funcionamento foram concluídas com sucesso."
              IMPACT="Nenhum bloqueio automático foi encontrado."
              NEXT_STEP="A atualização pode seguir para a próxima etapa do processo."
            elif [ "$CONCLUSION" = "failure" ]; then
              EMBED_TITLE="❌ Verificações com problema"
              COLOR=15548997
              SUMMARY="Uma ou mais verificações automáticas encontraram problemas."
              IMPACT="A atualização fica bloqueada até a correção."
              NEXT_STEP="A equipe técnica irá analisar o problema antes de seguir."
            elif [ "$CONCLUSION" = "cancelled" ]; then
              EMBED_TITLE="⚪ Verificações canceladas"
              COLOR=9807270
              SUMMARY="As verificações automáticas foram interrompidas antes de terminar."
              IMPACT="Ainda não existe uma validação final desta atualização."
              NEXT_STEP="A equipe poderá executar as verificações novamente."
            else
              EMBED_TITLE="ℹ️ Verificações concluídas"
              COLOR=3447003
              SUMMARY="As verificações automáticas terminaram sem um resultado padrão reconhecido."
              IMPACT="Ainda é necessário confirmar se existe algum bloqueio."
              NEXT_STEP="A equipe técnica avaliará o resultado."
            fi

            FOOTER="Supreme • Verificação automática"

            PAYLOAD=$(jq -n \
              --arg title "$EMBED_TITLE" \
              --arg url "$RUN_URL" \
              --arg summary "$SUMMARY" \
              --arg impact "$IMPACT" \
              --arg next "$NEXT_STEP" \
              --arg footer "$FOOTER" \
              --argjson color "$COLOR" \
              '{
                allowed_mentions: {parse: []},
                embeds: [{
                  title: $title,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "Resultado", value: $summary, inline: false},
                    {name: "Impacto", value: $impact, inline: false},
                    {name: "Próximo passo", value: $next, inline: false}
                  ],
                  footer: {text: $footer}
                }]
              }')
          fi

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
